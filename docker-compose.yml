# meerverse.com on Coolify, as a Docker Compose resource.
#
# One stateless nginx container. Coolify's Traefik terminates TLS and routes
# the domain to it; nothing is published on the host and nothing is stored, so
# a redeploy is a rebuild and nothing else. README.md has the Coolify steps.
#
# For a local preview, add the dev overlay, which publishes a port:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  website:
    build: .
    # `expose`, not `ports`. Coolify's Traefik reaches the container over the
    # project network. Set the domain on this service in the Coolify UI
    # (Domains: https://meerverse.com,https://www.meerverse.com); port 80 is
    # the one Coolify routes to when the domain names none.
    expose:
      - "80"
    restart: unless-stopped
